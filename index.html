<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portal Fatos Públicos</title><style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#17191c;--muted:#68707c;--line:#dde1e7;--accent:#202a44;--soft:#eef1f6;--good:#236847;--bad:#8a2834;--warn:#8a5c00}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,Segoe UI,Arial,sans-serif;color:var(--ink)}header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:3}.nav,main{max-width:1180px;margin:auto;padding:14px 18px}.nav{display:flex;justify-content:space-between;gap:12px}.brand{font-weight:800}.badge,.tag{font-size:12px;padding:5px 8px;border-radius:999px;background:var(--soft);color:var(--muted)}main{padding-top:22px}.hero{display:grid;grid-template-columns:1fr 1.4fr;gap:16px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px}.person{display:flex;gap:14px;align-items:center}.avatar{width:70px;height:70px;border-radius:18px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800;font-size:23px}h1{font-size:26px;margin:0 0 4px}h2{font-size:19px;margin:0 0 12px}h3{font-size:15px;margin:16px 0 8px}.muted{color:var(--muted);font-size:13px;line-height:1.5}.search{display:flex;gap:8px}.search input{flex:1;padding:13px;border:1px solid var(--line);border-radius:11px;font-size:15px}.search button,.btn{border:0;background:var(--accent);color:#fff;border-radius:10px;padding:10px 13px;font-weight:700;cursor:pointer;text-decoration:none}.answer{margin-top:10px;background:var(--soft);border-radius:10px;padding:12px;min-height:62px;font-size:14px;line-height:1.5}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}.metric b{display:block;font-size:21px}.metric span{font-size:12px;color:var(--muted)}.tabs{display:flex;gap:7px;overflow:auto;margin:16px 0 10px}.tabs button{background:#fff;border:1px solid var(--line);padding:9px 11px;border-radius:10px;white-space:nowrap;cursor:pointer}.tabs button.active{background:var(--accent);color:#fff}.panel{display:none}.panel.active{display:block}.notice{background:#fff8e7;border-left:3px solid var(--warn);padding:10px;border-radius:8px;font-size:12px;margin-bottom:12px}.records{display:grid;gap:9px}.record{border:1px solid var(--line);border-radius:12px;padding:13px}.row{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.vote{display:grid;grid-template-columns:130px 1fr 120px;gap:12px}.status{font-weight:800}.sim{color:var(--good)}.nao{color:var(--bad)}.money{text-align:right;white-space:nowrap}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:9px 7px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}.source{font-size:11px;color:var(--muted)}.barrow{display:grid;grid-template-columns:240px 1fr 120px;gap:9px;align-items:center;margin:8px 0;font-size:13px}.bar{height:9px;background:var(--soft);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}.timeline{border-left:2px solid var(--line);padding-left:17px}.event{margin-bottom:14px}.loading{padding:40px;text-align:center}.error{color:var(--bad)}@media(max-width:800px){.hero{grid-template-columns:1fr}.metrics{grid-template-columns:1fr 1fr}.vote,.barrow{grid-template-columns:1fr}.money{text-align:left}}</style></head><body><header><div class="nav"><div class="brand">Portal Fatos Públicos <span class="badge">PILOTO v0.7 web</span></div><div class="badge">O portal informa; o eleitor conclui.</div></div></header><main><div id="app" class="loading">Carregando base pública…</div></main><script>
const money=v=>v==null?'—':new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(v);const esc=s=>(s??'').toString().replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]));const strip=s=>(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
async function loadData(){const files=['dados/data_part_01.b64','dados/data_part_02.b64','dados/data_part_03.b64','dados/data_part_04.b64'];const b64=(await Promise.all(files.map(f=>fetch(f,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Base não encontrada: '+f);return r.text()})))).join('').replace(/\s+/g,'');const bin=atob(b64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);if(!('DecompressionStream'in window))throw Error('Navegador sem suporte à descompactação gzip');const ds=new DecompressionStream('gzip');return JSON.parse(await new Response(new Blob([u]).stream().pipeThrough(ds)).text())}
function voteCard(v){const cls=v.status_voto==='sim'?'sim':v.status_voto==='nao'?'nao':'';return `<div class="record vote"><div><div class="status ${cls}">${esc(v.voto)}</div><div class="source">${esc(v.data||'')}</div></div><div><b>${esc(v.materia)}</b><div class="muted">${esc(v.objeto||'')}</div><div class="source">${esc(v.contexto||'')}</div></div><div><a class="btn" href="${esc(v.url)}" target="_blank" rel="noopener">Fonte</a></div></div>`}
function recordCard(r){return `<div class="record"><div class="row"><span class="tag">${esc(r.data)}</span><span class="tag">${esc(r.tipo)}</span><b>${esc(r.titulo)}</b></div><div class="muted">${esc(r.registro_factual||'')}</div>${r.url_fonte?`<div style="margin-top:8px"><a class="btn" href="${esc(r.url_fonte)}" target="_blank" rel="noopener">Fonte oficial</a></div>`:''}</div>`}
function render(D){const p=D.politico,V=D.votacoes_nominais||[],E=D.emendas_carregadas||[],R=D.registros||[],F=D.fin||[],G=D.gastos_mandato||[];const campanha=F.find(x=>x.tipo==='despesa_campanha'&&x.categoria==='Total declarado')?.valor||0,receita=F.find(x=>x.tipo==='receita_campanha'&&x.categoria==='Total arrecadado')?.valor||0,er=D.emendas_resumo||{};document.querySelector('main').innerHTML=`<section class="hero"><div class="card"><div class="person"><div class="avatar">FB</div><div><h1>${esc(p.nome_urna)}</h1><div class="muted">${esc(p.cargo_atual)} · ${esc(p.partido_atual)} · nº ${esc(p.numero_atual)} · candidatura ${esc(p.situacao_candidatura)}</div></div></div><p class="muted">Prioridade factual: votos → dinheiro → atos/projetos → falas. Cobertura ainda parcial e em expansão.</p></div><div class="card"><h2>Consulta em linguagem natural</h2><div class="search"><input id="q" placeholder="Ex.: Como ele votou recentemente?"><button id="ask">Perguntar</button></div><div id="answer" class="answer"><b>Busca local.</b> Consulte votos, emendas, gastos, campanha, patrimônio ou projetos já carregados.</div></div></section><section class="metrics"><div class="card metric"><b>${V.length}</b><span>votações nominais carregadas</span></div><div class="card metric"><b>${R.length}</b><span>registros de atuação</span></div><div class="card metric"><b>${E.length}</b><span>emendas carregadas</span></div><div class="card metric"><b>${money(campanha)}</b><span>despesas de campanha no snapshot</span></div></section><div class="tabs">${[['votos','Como votou'],['dinheiro','Dinheiro público'],['campanha','Campanha'],['atuacao','Projetos e atuação'],['patrimonio','Patrimônio'],['trajetoria','Trajetória'],['metodo','Método']].map((x,i)=>`<button data-tab="${x[0]}" class="${i?'':'active'}">${x[1]}</button>`).join('')}</div><section id="votos" class="panel active card"></section><section id="dinheiro" class="panel card"></section><section id="campanha" class="panel card"></section><section id="atuacao" class="panel card"></section><section id="patrimonio" class="panel card"></section><section id="trajetoria" class="panel card"></section><section id="metodo" class="panel card"></section>`;
document.getElementById('votos').innerHTML=`<h2>Como votou</h2><div class="notice">Ausência, licença e presença sem registrar voto não são convertidas em Sim ou Não.</div><div class="records">${V.map(voteCard).join('')||'<div class="muted">Nenhuma votação carregada.</div>'}</div>`;
const areas=Object.entries(er.por_area||{});document.getElementById('dinheiro').innerHTML=`<h2>Dinheiro público</h2><div class="notice">A soma abaixo representa somente as emendas já carregadas, não o total do mandato.</div><p><b>Empenhado:</b> ${money(er.empenhado)} · <b>Pago:</b> ${money(er.pago)}</p><h3>Por área</h3><table><tbody>${areas.map(([a,x])=>`<tr><td>${esc(a)}</td><td>${x.qtd} registro(s)</td><td class="money">${money(x.empenhado)}</td><td class="money">${money(x.pago)}</td></tr>`).join('')}</tbody></table><h3>Emendas carregadas</h3><table><tbody>${E.map(e=>`<tr><td>${e.ano}</td><td><b>${esc(e.funcao)}</b><br><span class="source">${esc(e.descricao)}</span></td><td>${esc(e.localidade)}</td><td class="money">${money(e.empenhado)}</td><td class="money">${money(e.pago)}</td><td><a href="${esc(e.url)}" target="_blank">Fonte</a></td></tr>`).join('')}</tbody></table><h3>Gastos do mandato</h3>${G.map(g=>`<div class="record"><b>${g.ano}: ${money(g.total_mostrado)}</b><div class="muted">Cotas: ${money(g.total_cotas)} · outros grupos mostrados: ${money(g.gastos_fora_cota)}</div></div>`).join('')}`;
const cats=F.filter(x=>x.tipo==='despesa_campanha'&&x.descricao==='Categoria agregada').sort((a,b)=>b.valor-a.valor),sup=F.filter(x=>x.tipo==='despesa_fornecedor').sort((a,b)=>b.valor-a.valor),mx=Math.max(...cats.map(x=>x.valor),1);document.getElementById('campanha').innerHTML=`<h2>Campanha 2026</h2><div class="notice">Prestação ainda em curso; valores são do snapshot indicado na base.</div><p><b>Receitas:</b> ${money(receita)} · <b>Despesas:</b> ${money(campanha)}</p><h3>Categorias de gasto</h3>${cats.map(x=>`<div class="barrow"><div>${esc(x.categoria)}</div><div class="bar"><i style="width:${100*x.valor/mx}%"></i></div><div class="money">${money(x.valor)}</div></div>`).join('')}<h3>Maiores fornecedores carregados</h3><table><tbody>${sup.map(x=>`<tr><td>${esc(x.contraparte)}</td><td>${esc(x.categoria)}</td><td class="money">${money(x.valor)}</td></tr>`).join('')}</tbody></table>`;
document.getElementById('atuacao').innerHTML=`<h2>Projetos e atuação</h2><input id="filtro" placeholder="Filtrar por tema ou palavra" style="width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;margin-bottom:10px"><div id="regs" class="records"></div>`;const rr=()=>{const q=strip(document.getElementById('filtro').value);document.getElementById('regs').innerHTML=R.filter(r=>!q||strip([r.titulo,r.registro_factual,r.contexto,r.tema,r.id_oficial].join(' ')).includes(q)).sort((a,b)=>String(b.data).localeCompare(String(a.data))).map(recordCard).join('')};document.getElementById('filtro').oninput=rr;rr();
const hist=(D.eleicoes||[]).filter(e=>e.patrimonio_total!=null).sort((a,b)=>a.ano-b.ano),maxp=Math.max(...hist.map(x=>x.patrimonio_total),1);document.getElementById('patrimonio').innerHTML=`<h2>Patrimônio declarado</h2><div class="notice">Valores declarados ao TSE; variação patrimonial não é tratada como indício de irregularidade.</div>${hist.map(x=>`<div class="barrow"><div>${x.ano} · ${esc(x.cargo)}</div><div class="bar"><i style="width:${100*x.patrimonio_total/maxp}%"></i></div><div class="money">${money(x.patrimonio_total)}</div></div>`).join('')}<h3>Bens de 2026</h3><table><tbody>${(D.bens||[]).map(x=>`<tr><td>${esc(x.tipo_bem)}</td><td>${esc(x.descricao)}</td><td class="money">${money(x.valor_declarado)}</td></tr>`).join('')}</tbody></table>`;
const tl=[...(D.eleicoes||[]).map(e=>({y:e.ano,t:`${e.cargo} — ${e.partido}`,d:e.resultado})),...(D.eventos||[]).map(e=>({y:(e.data_inicio||'').slice(0,4),t:e.titulo,d:e.descricao}))].sort((a,b)=>String(a.y).localeCompare(String(b.y)));document.getElementById('trajetoria').innerHTML=`<h2>Trajetória</h2><div class="timeline">${tl.map(x=>`<div class="event"><b>${esc(x.y)} · ${esc(x.t)}</b><div class="muted">${esc(x.d||'')}</div></div>`).join('')}</div>`;
document.getElementById('metodo').innerHTML=`<h2>Método</h2><p class="muted">Mesmos critérios para todos; fontes oficiais preferenciais; fato separado de interpretação; contexto antes da conclusão; ausência de evidência não é evidência de ausência; classificações devem ser reproduzíveis e conservadoras.</p><div class="notice">Esta versão ainda é piloto e a cobertura não é exaustiva. O portal informa; o eleitor conclui.</div>`;
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.tab).classList.add('active')});function ask(){const raw=document.getElementById('q').value.trim(),s=strip(raw),a=document.getElementById('answer');if(!raw){a.textContent='Digite uma pergunta.';return}if(s.includes('vot')){let rows=V;if(s.includes(' nao'))rows=V.filter(v=>v.status_voto==='nao');else if(s.includes(' sim'))rows=V.filter(v=>v.status_voto==='sim');a.innerHTML=`<b>${rows.length} votação(ões)</b><div class="records" style="margin-top:8px">${rows.map(voteCard).join('')}</div>`;return}if(s.includes('emenda')||s.includes('dinheiro publico')){a.innerHTML=`<b>${E.length} emendas carregadas.</b> Empenhado ${money(er.empenhado)}; pago ${money(er.pago)}.`;return}if(s.includes('campanha')||s.includes('fornecedor')){a.innerHTML=`<b>Campanha:</b> ${money(campanha)} em despesas no snapshot. Maior fornecedor carregado: ${esc(sup[0]?.contraparte||'—')} (${money(sup[0]?.valor)}).`;return}if(s.includes('patrimonio')||s.includes('bens')){a.innerHTML=`<b>Patrimônio declarado em 2026:</b> ${money(hist.at(-1)?.patrimonio_total)}.`;return}const terms=strip(raw).split(/\s+/).filter(x=>x.length>3),hits=[...V.map(v=>({h:voteCard(v),t:strip([v.materia,v.objeto,v.contexto,v.tema].join(' '))})),...R.map(r=>({h:recordCard(r),t:strip([r.titulo,r.registro_factual,r.contexto,r.tema].join(' '))}))].map(x=>({...x,n:terms.filter(t=>x.t.includes(t)).length})).filter(x=>x.n).sort((a,b)=>b.n-a.n).slice(0,8);a.innerHTML=hits.length?`<b>${hits.length} registros relacionados</b><div class="records" style="margin-top:8px">${hits.map(x=>x.h).join('')}</div>`:'Não encontrei registro seguro na base carregada.'}document.getElementById('ask').onclick=ask;document.getElementById('q').onkeydown=e=>{if(e.key==='Enter')ask()}}
loadData().then(render).catch(e=>document.querySelector('main').innerHTML=`<div class="card error"><b>Falha ao carregar o portal.</b><br>${esc(e.message)}</div>`);
</script></body></html>
