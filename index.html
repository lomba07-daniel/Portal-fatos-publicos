<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portal Fatos Públicos</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#17191c;--muted:#68707c;--line:#dde1e7;--accent:#202a44;--soft:#eef1f6;--good:#236847;--bad:#8a2834;--warn:#8a5c00}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,Segoe UI,Arial,sans-serif;color:var(--ink)}header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:3}.nav,main{max-width:1180px;margin:auto;padding:14px 18px}.nav{display:flex;justify-content:space-between;gap:12px}.brand{font-weight:800}.badge,.tag{font-size:12px;padding:5px 8px;border-radius:999px;background:var(--soft);color:var(--muted)}main{padding-top:22px}.hero{display:grid;grid-template-columns:1fr 1.4fr;gap:16px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px}.person{display:flex;gap:14px;align-items:center}.avatar{width:70px;height:70px;border-radius:18px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800;font-size:23px}h1{font-size:26px;margin:0 0 4px}h2{font-size:19px;margin:0 0 12px}h3{font-size:15px;margin:16px 0 8px}.muted{color:var(--muted);font-size:13px;line-height:1.5}.search{display:flex;gap:8px}.search input,.filters input,.filters select{flex:1;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:14px;background:#fff}.search input{padding:13px;font-size:15px}.search button,.btn{border:0;background:var(--accent);color:#fff;border-radius:10px;padding:10px 13px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}.btn.secondary{background:#fff;color:var(--accent);border:1px solid var(--line);margin-top:6px}.answeritem{padding:10px 0;border-bottom:1px solid var(--line)}.answeritem:last-child{border-bottom:0}.matchwhy{font-size:11px;color:var(--muted);margin-top:4px}.answer{margin-top:10px;background:var(--soft);border-radius:10px;padding:12px;min-height:62px;font-size:14px;line-height:1.5}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}.metric b{display:block;font-size:21px}.metric span{font-size:12px;color:var(--muted)}.tabs{display:flex;gap:7px;overflow:auto;margin:16px 0 10px}.tabs button{background:#fff;border:1px solid var(--line);padding:9px 11px;border-radius:10px;white-space:nowrap;cursor:pointer}.tabs button.active{background:var(--accent);color:#fff}.panel{display:none}.panel.active{display:block}.notice{background:#fff8e7;border-left:3px solid var(--warn);padding:10px;border-radius:8px;font-size:12px;margin-bottom:12px}.oknote{background:#eef8f2;border-left-color:var(--good)}.records{display:grid;gap:9px}.record{border:1px solid var(--line);border-radius:12px;padding:13px}.row{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.vote{display:grid;grid-template-columns:145px 1fr 100px;gap:12px}.status{font-weight:800}.sim{color:var(--good)}.nao{color:var(--bad)}.money{text-align:right;white-space:nowrap}.filters{display:grid;grid-template-columns:150px 200px 1fr;gap:8px;margin:12px 0}.countline{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:8px 0 12px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:9px 7px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}.source{font-size:11px;color:var(--muted)}.barrow{display:grid;grid-template-columns:240px 1fr 120px;gap:9px;align-items:center;margin:8px 0;font-size:13px}.bar{height:9px;background:var(--soft);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}.timeline{border-left:2px solid var(--line);padding-left:17px}.event{margin-bottom:14px}.loading{padding:40px;text-align:center}.error{color:var(--bad)}@media(max-width:800px){.hero{grid-template-columns:1fr}.metrics{grid-template-columns:1fr 1fr}.vote,.barrow,.filters{grid-template-columns:1fr}.money{text-align:left}.nav{align-items:flex-start;flex-direction:column}}

.money-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}.money-summary .record b{font-size:20px;display:block}.money-controls{display:grid;grid-template-columns:180px 260px;gap:8px;margin:10px 0 14px}.money-controls select{padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:14px}.donut-layout{display:grid;grid-template-columns:240px 1fr;gap:20px;align-items:center;margin:12px 0 18px}.donut{width:220px;height:220px;border-radius:50%;position:relative;margin:auto}.donut-hole{position:absolute;inset:44px;border-radius:50%;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px;border:1px solid var(--line)}.donut-hole b{font-size:18px}.donut-hole span{font-size:11px;color:var(--muted)}.legend{display:grid;gap:7px}.legendrow{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:12px}.legenddot{width:10px;height:10px;border-radius:3px}.trend{display:grid;gap:8px;margin:10px 0 14px}.trendrow{display:grid;grid-template-columns:60px minmax(120px,1fr) 120px;gap:9px;align-items:center;font-size:12px}.trendbar{height:18px;background:var(--soft);border-radius:5px;overflow:hidden;display:flex}.trendbar i{height:100%;display:block}.trendbar .ceaps{background:#202a44}.trendbar .fora{background:#7f9c84}.trendlegend{display:flex;gap:15px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-bottom:8px}.trendlegend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}.cat-table td:first-child{width:58%}.source-actions{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 18px}@media(max-width:800px){.money-summary{grid-template-columns:1fr}.money-controls,.donut-layout,.trendrow{grid-template-columns:1fr}.donut{width:190px;height:190px}.donut-hole{inset:38px}.trendrow{gap:4px}.trendrow>.money{text-align:left}.legendrow{grid-template-columns:12px minmax(0,1fr) auto}}
</style>
</head>
<body>
<header><div class="nav"><div class="brand">Portal Fatos Públicos <span class="badge">PILOTO v0.11 web</span></div><div class="badge">O portal informa; o eleitor conclui.</div></div></header>
<main><div id="app" class="loading">Carregando base pública…</div></main>
<script>
const money=v=>v==null?'—':new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(v);
const esc=s=>(s??'').toString().replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]));
const strip=s=>(s??'').toString().normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const fmtDateTime=s=>{try{return new Date(s).toLocaleString('pt-BR')}catch{return s||''}};
async function getJSON(url,required=true){const r=await fetch(url,{cache:'no-store'});if(!r.ok){if(required)throw Error('Base não encontrada: '+url);return null}return r.json()}
async function loadData(){
 const files=['dados/data_part_01.b64','dados/data_part_02.b64','dados/data_part_03.b64','dados/data_part_04.b64'];
 const [parts,atual,historico,amostra,gastos]=await Promise.all([
  Promise.all(files.map(f=>fetch(f,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Base não encontrada: '+f);return r.text()}))),
  getJSON('dados/votacoes_senado.json'),getJSON('dados/votacoes_senado_historico.json'),getJSON('dados/validacao_amostra_votacoes_2019_2025.json',false),getJSON('dados/gastos_mandato_senado.json')
 ]);
 const b64=parts.join('').replace(/\s+/g,''),bin=atob(b64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
 if(!('DecompressionStream'in window))throw Error('Navegador sem suporte à descompactação gzip');
 const D=JSON.parse(await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).text());
 if(atual.ano!==2026||!Array.isArray(atual.votacoes))throw Error('Base de votações 2026 em formato inesperado');
 if(historico.escopo!=='historico_fechado'||!Array.isArray(historico.votacoes)||historico.votacoes.length<1000)throw Error('Base histórica 2019–2025 em formato inesperado');
 if(gastos.escopo!=='gastos_mandato_senado'||!Array.isArray(gastos.por_ano)||gastos.por_ano.length<8)throw Error('Base de gastos do mandato em formato inesperado');
 const uniq=new Map();[...historico.votacoes,...atual.votacoes].forEach(v=>uniq.set([v.data,v.codigo_sessao_votacao,v.materia,v.objeto].join('|'),v));
 D.votacoes_nominais=[...uniq.values()].sort((a,b)=>String(b.data).localeCompare(String(a.data))||String(b.codigo_sessao_votacao).localeCompare(String(a.codigo_sessao_votacao)));
 D.votacoes_meta={inicio:2019,fim:2026,total:D.votacoes_nominais.length,historico_quantidade:historico.quantidade,duplicados_historico:historico.duplicados_removidos,atual_quantidade:atual.quantidade,atualizado_em_utc:atual.atualizado_em_utc,validacao_atual:atual.validacao,amostra};
 D.gastos_mandato_oficial=gastos;
 return D;
}
function senateMatterUrl(v,suffix=''){const id=String(v.codigo_materia||'').trim();return /^\d+$/.test(id)?`https://www25.senado.leg.br/web/atividade/materias/-/materia/${id}${suffix}`:(v.url||'#')}
function voteCard(v){const cls=v.status_voto==='sim'?'sim':v.status_voto==='nao'?'nao':'';const voteUrl=senateMatterUrl(v,'/votacoes'),matterUrl=senateMatterUrl(v);return `<div class="record vote"><div><div class="status ${cls}">${esc(v.voto)}</div><div class="source">${esc(v.data||'')} · ${esc(v.ano_arquivo||'')}</div></div><div><b>${esc(v.materia)}</b><div class="muted">${esc(v.objeto||'')}</div><div class="source">${esc(v.contexto||'')}</div></div><div><a class="btn" href="${esc(voteUrl)}" target="_blank" rel="noopener">Ver votação</a><br><a class="btn secondary" href="${esc(matterUrl)}" target="_blank" rel="noopener">Ver matéria</a></div></div>`}
function recordCard(r){return `<div class="record"><div class="row"><span class="tag">${esc(r.data)}</span><span class="tag">${esc(r.tipo)}</span><b>${esc(r.titulo)}</b></div><div class="muted">${esc(r.registro_factual||'')}</div>${r.url_fonte?`<div style="margin-top:8px"><a class="btn" href="${esc(r.url_fonte)}" target="_blank" rel="noopener">Fonte oficial</a></div>`:''}</div>`}

const EXPENSE_COLORS=['#202a44','#3e5c76','#6f8faa','#7f9c84','#b08b57','#8d6a9f','#b85c5c','#5d7a6f'];
function donutHtml(items,total,label){const nz=(items||[]).filter(x=>Number(x.valor)>0).sort((a,b)=>b.valor-a.valor);if(!nz.length||!total)return '<div class="muted">Sem valores para esta seleção.</div>';let cur=0;const stops=nz.map((x,i)=>{const a=cur,b=cur+(Number(x.valor)/total)*360;cur=b;return `${EXPENSE_COLORS[i%EXPENSE_COLORS.length]} ${a.toFixed(2)}deg ${b.toFixed(2)}deg`});const legend=nz.map((x,i)=>`<div class="legendrow"><span class="legenddot" style="background:${EXPENSE_COLORS[i%EXPENSE_COLORS.length]}"></span><span>${esc(x.categoria)}</span><span>${money(x.valor)} · ${(100*x.valor/total).toFixed(1).replace('.',',')}%</span></div>`).join('');return `<div class="donut-layout"><div class="donut" role="img" aria-label="Composição das despesas por categoria" style="background:conic-gradient(${stops.join(',')})"><div class="donut-hole"><b>${money(total)}</b><span>${esc(label)}</span></div></div><div class="legend">${legend}</div></div>`}
function expenseTrendHtml(rows){const max=Math.max(...rows.map(r=>Number(r.total_mostrado)||0),1);return `<div class="trendlegend"><span><i style="background:#202a44"></i>CEAPS</span><span><i style="background:#7f9c84"></i>Gastos fora da CEAPS exibidos pelo Senado</span></div><div class="trend">${rows.map(r=>{const a=100*r.total_ceaps/max,b=100*r.total_fora_ceaps/max;return `<div class="trendrow"><b>${r.ano}${r.parcial?'*':''}</b><div class="trendbar" title="${money(r.total_mostrado)}"><i class="ceaps" style="width:${a}%"></i><i class="fora" style="width:${b}%"></i></div><div class="money">${money(r.total_mostrado)}</div></div>`}).join('')}</div>`}
function expenseRowsTable(items,total){const rows=(items||[]).slice().sort((a,b)=>b.valor-a.valor);return `<table class="cat-table"><thead><tr><th>Categoria</th><th>Valor</th><th>Participação</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.categoria)}</td><td class="money">${money(x.valor)}</td><td>${total?`${(100*x.valor/total).toFixed(1).replace('.',',')}%`:'—'}</td></tr>`).join('')}</tbody></table>`}

function render(D){
 const p=D.politico,V=D.votacoes_nominais||[],E=D.emendas_carregadas||[],R=D.registros||[],F=D.fin||[],G=D.gastos_mandato||[],GO=D.gastos_mandato_oficial||null,VM=D.votacoes_meta||{};
 const campanha=F.find(x=>x.tipo==='despesa_campanha'&&x.categoria==='Total declarado')?.valor||0,receita=F.find(x=>x.tipo==='receita_campanha'&&x.categoria==='Total arrecadado')?.valor||0,er=D.emendas_resumo||{};
 document.querySelector('main').innerHTML=`<section class="hero"><div class="card"><div class="person"><div class="avatar">FB</div><div><h1>${esc(p.nome_urna)}</h1><div class="muted">${esc(p.cargo_atual)} · ${esc(p.partido_atual)} · nº ${esc(p.numero_atual)} · candidatura ${esc(p.situacao_candidatura)}</div></div></div><p class="muted">Prioridade factual: votos → dinheiro → atos/projetos → falas. Cobertura ainda parcial fora do histórico nominal do Senado.</p></div><div class="card"><h2>Consulta em linguagem natural</h2><div class="search"><input id="q" placeholder="Ex.: Como ele votou na PEC 133/2019?"><button id="ask">Perguntar</button></div><div id="answer" class="answer"><b>Busca local.</b> Consulte votos de 2019–2026, emendas, gastos, campanha, patrimônio ou projetos já carregados.</div></div></section><section class="metrics"><div class="card metric"><b>${V.length}</b><span>votações nominais 2019–2026</span></div><div class="card metric"><b>${R.length}</b><span>registros de atuação</span></div><div class="card metric"><b>${E.length}</b><span>emendas carregadas</span></div><div class="card metric"><b>${money(campanha)}</b><span>despesas de campanha no snapshot</span></div></section><div class="tabs">${[['votos','Como votou'],['dinheiro','Dinheiro público'],['campanha','Campanha'],['atuacao','Projetos e atuação'],['patrimonio','Patrimônio'],['trajetoria','Trajetória'],['metodo','Método']].map((x,i)=>`<button data-tab="${x[0]}" class="${i?'':'active'}">${x[1]}</button>`).join('')}</div><section id="votos" class="panel active card"></section><section id="dinheiro" class="panel card"></section><section id="campanha" class="panel card"></section><section id="atuacao" class="panel card"></section><section id="patrimonio" class="panel card"></section><section id="trajetoria" class="panel card"></section><section id="metodo" class="panel card"></section>`;
 const validation=VM.amostra?.resultado_geral==='aprovado'?`Histórico 2019–2025 validado estruturalmente e por amostragem independente (${VM.amostra.quantidade_aprovada}/${VM.amostra.quantidade_amostrada}).`:'';
 document.getElementById('votos').innerHTML=`<h2>Como votou — 2019 a 2026</h2><div class="notice oknote">${esc(validation||'Histórico 2019–2025 validado.')} A base de 2026 continua sendo atualizada automaticamente. Ausência, licença e presença sem registrar voto não são convertidas em Sim ou Não.</div><div class="source">Histórico: ${VM.historico_quantidade||0} registros · 2026: ${VM.atual_quantidade||0} registros · última atualização de 2026: ${esc(fmtDateTime(VM.atualizado_em_utc))}.</div><div class="filters"><select id="voteYear"><option value="">Todos os anos</option>${[2026,2025,2024,2023,2022,2021,2020,2019].map(y=>`<option value="${y}">${y}</option>`).join('')}</select><select id="voteStatus"><option value="">Todos os status</option><option value="sim">Sim</option><option value="nao">Não</option><option value="presente_sem_voto">Presente sem voto</option><option value="voto_secreto">Voto secreto</option><option value="abstencao">Abstenção</option><option value="ausencia">Ausência</option><option value="licenca">Licença</option><option value="atividade_parlamentar">Atividade parlamentar</option></select><input id="voteText" placeholder="Filtrar matéria ou objeto"></div><div class="countline"><div id="voteCount" class="muted"></div><button id="moreVotes" class="btn" type="button">Mostrar mais</button></div><div id="voteRecords" class="records"></div>`;
 let voteLimit=100;
 const renderVotes=()=>{const y=document.getElementById('voteYear').value,s=document.getElementById('voteStatus').value,q=strip(document.getElementById('voteText').value);const list=V.filter(v=>(!y||String(v.data).startsWith(y))&&(!s||v.status_voto===s)&&(!q||strip([v.materia,v.objeto,v.voto,v.descricao_voto].join(' ')).includes(q)));document.getElementById('voteCount').textContent=`${list.length} registro(s) encontrado(s)${list.length>voteLimit?` · exibindo ${voteLimit}`:''}`;document.getElementById('voteRecords').innerHTML=list.slice(0,voteLimit).map(voteCard).join('')||'<div class="muted">Nenhuma votação encontrada.</div>';document.getElementById('moreVotes').style.display=list.length>voteLimit?'inline-block':'none'};
 ['voteYear','voteStatus','voteText'].forEach(id=>document.getElementById(id).addEventListener(id==='voteText'?'input':'change',()=>{voteLimit=100;renderVotes()}));document.getElementById('moreVotes').onclick=()=>{voteLimit+=100;renderVotes()};renderVotes();
 const areas=Object.entries(er.por_area||{});
 if(GO&&Array.isArray(GO.por_ano)){
  document.getElementById('dinheiro').innerHTML=`<h2>Dinheiro público</h2><div class="notice oknote"><b>Gastos do mandato no Senado — 2019 a 2026.</b> Valores coletados diretamente da API oficial do Senado e atualizados automaticamente. O ano de 2026 é parcial. A soma mostrada abaixo reúne CEAPS e os gastos não inclusos na CEAPS exibidos nessa página do Senado; <b>não representa o custo integral do mandato</b> e não inclui, por exemplo, folha de pessoal ou subsídio do senador.</div><div class="money-summary"><div class="record"><span class="source">CEAPS no período</span><b>${money(GO.total_ceaps_periodo)}</b></div><div class="record"><span class="source">Fora da CEAPS exibidos</span><b>${money(GO.total_fora_ceaps_periodo)}</b></div><div class="record"><span class="source">Soma das duas seções</span><b>${money(GO.total_mostrado_periodo)}</b></div></div><div class="source">Atualizado em ${esc(fmtDateTime(GO.atualizado_em_utc))}. *2026 parcial e sujeito a ajustes, estornos ou novos lançamentos.</div><h3>Evolução anual dos recursos exibidos</h3>${expenseTrendHtml(GO.por_ano)}<h3>Composição por categoria</h3><div class="money-controls"><select id="expenseYear"><option value="periodo">Período 2019–2026</option>${GO.por_ano.slice().reverse().map(x=>`<option value="${x.ano}">${x.ano}${x.parcial?' (parcial)':''}</option>`).join('')}</select><select id="expenseGroup"><option value="ceaps">CEAPS</option><option value="fora">Gastos fora da CEAPS exibidos</option></select></div><div id="expenseChart"></div><div id="expenseTable"></div><div id="expenseSource" class="source-actions"></div><h3>Emendas parlamentares carregadas</h3><div class="notice">As emendas abaixo ainda são uma amostra e não representam o total destinado no mandato.</div><p><b>Empenhado na amostra:</b> ${money(er.empenhado)} · <b>Pago na amostra:</b> ${money(er.pago)}</p><h3>Por área — amostra de emendas</h3><table><tbody>${areas.map(([a,x])=>`<tr><td>${esc(a)}</td><td>${x.qtd} registro(s)</td><td class="money">${money(x.empenhado)}</td><td class="money">${money(x.pago)}</td></tr>`).join('')}</tbody></table><h3>Emendas carregadas</h3><table><tbody>${E.map(e=>`<tr><td>${e.ano}</td><td><b>${esc(e.funcao)}</b><br><span class="source">${esc(e.descricao)}</span></td><td>${esc(e.localidade)}</td><td class="money">${money(e.empenhado)}</td><td class="money">${money(e.pago)}</td><td><a href="${esc(e.url)}" target="_blank" rel="noopener">Fonte</a></td></tr>`).join('')}</tbody></table>`;
  const renderExpense=()=>{const y=document.getElementById('expenseYear').value,g=document.getElementById('expenseGroup').value;let items,total,label,source='https://www12.senado.leg.br/dados-abertos/administrativo/senadores/cotas-para-exercicio-da-atividade-parlamentar';if(y==='periodo'){items=g==='ceaps'?GO.agregado_ceaps:GO.agregado_fora_ceaps;total=g==='ceaps'?GO.total_ceaps_periodo:GO.total_fora_ceaps_periodo;label=(g==='ceaps'?'CEAPS':'Fora da CEAPS')+' · 2019–2026'}else{const row=GO.por_ano.find(x=>String(x.ano)===y);items=g==='ceaps'?row.ceaps:row.fora_ceaps;total=g==='ceaps'?row.total_ceaps:row.total_fora_ceaps;label=(g==='ceaps'?'CEAPS':'Fora da CEAPS')+' · '+y+(row.parcial?' parcial':'');source=row.fonte_visual}document.getElementById('expenseChart').innerHTML=donutHtml(items,total,label);document.getElementById('expenseTable').innerHTML=expenseRowsTable(items,total);document.getElementById('expenseSource').innerHTML=`<a class="btn" href="${esc(source)}" target="_blank" rel="noopener">Abrir fonte oficial do Senado</a>`};
  document.getElementById('expenseYear').onchange=renderExpense;document.getElementById('expenseGroup').onchange=renderExpense;renderExpense();
 }else{
  document.getElementById('dinheiro').innerHTML=`<h2>Dinheiro público</h2><div class="notice">Base oficial de gastos do mandato indisponível nesta carga.</div>`;
 }

 document.getElementById('metodo').innerHTML=`<h2>Método</h2><p class="muted"><b>O portal informa; o eleitor conclui.</b> Usamos prioritariamente fontes oficiais e separamos fato, contexto e interpretação. A classificação nunca transforma ausência, licença ou presença sem voto em posição favorável ou contrária. O histórico nominal de 2019–2025 foi validado estruturalmente e por amostragem contra os arquivos oficiais; 2026 é atualizado automaticamente.</p><p class="muted">Não procuramos fatos para confirmar uma conclusão. Procuramos os fatos e mostramos o que eles dizem.</p>`;

 const q=document.getElementById('q'),answer=document.getElementById('answer');q.addEventListener('focus',()=>q.value='');
 const STOP=new Set(['a','ao','aos','as','o','os','de','da','das','do','dos','e','em','na','nas','no','nos','um','uma','uns','umas','para','por','pela','pelas','pelo','pelos','com','sem','sobre','que','qual','quais','como','ele','ela','dele','dela','se','sua','seu','suas','seus','foi','foram','ser','esta','este','isso','isto','mais','menos','muito','muita','muitos','muitas','relacao','respeito','posiciona','posicionou','posicao','tema','assunto','contra','favor']);
 const CONCEPTS=[
  {id:'violencia_mulher',label:'violência contra a mulher',triggers:['violencia contra a mulher','violencia mulher','violencia domestica','feminicidio','maria da penha'],aliases:['lei maria da penha','maria da penha','violencia domestica','violencia contra a mulher','violencia de genero','feminicidio','medida protetiva','medidas protetivas','protecao a mulher','protecao da mulher','agressor de mulher']},
  {id:'armas',label:'armas e munições',triggers:['arma','armas','armamento','municao','municoes','porte de arma','posse de arma'],aliases:['arma','armas','armamento','municao','municoes','porte de arma','posse de arma','registro de armas','cac','cacs']},
  {id:'seguranca',label:'segurança pública',triggers:['seguranca publica','policia','policial','crime','criminalidade'],aliases:['seguranca publica','policia','policial','crime','criminal','presidio','sistema penal']},

 ];
 const words=n=>n.split(/[^a-z0-9]+/).filter(x=>x.length>2&&!STOP.has(x));
 const conceptsFor=n=>CONCEPTS.filter(c=>c.triggers.some(t=>n.includes(strip(t))));
 const scoreRecord=(r,terms,concepts)=>{const title=strip(r.titulo||''),fact=strip(r.registro_factual||''),tema=strip(r.tema||''),ctx=strip(r.contexto||''),id=strip(r.id_oficial||''),all=[title,fact,tema,ctx,id].join(' ');let score=0,matched=new Set(),why=[];for(const t of terms){if(id.includes(t)){score+=12;matched.add(t)}if(tema.includes(t)){score+=8;matched.add(t)}if(title.includes(t)){score+=6;matched.add(t)}if(fact.includes(t)){score+=4;matched.add(t)}if(ctx.includes(t)){score+=2;matched.add(t)}}for(const c of concepts){const found=c.aliases.filter(a=>all.includes(strip(a)));if(found.length){score+=14+Math.min(found.length,3)*3;why.push(c.label)}}if(matched.size>=2)score+=8;const enough=concepts.length?score>=14:(terms.length<=1?score>=4:matched.size>=2);return enough?{score,matched:matched.size,why}:null};
 const searchRecords=n=>{const terms=words(n),concepts=conceptsFor(n);return R.map(r=>{const x=scoreRecord(r,terms,concepts);return x?{r,...x}:null}).filter(Boolean).sort((a,b)=>b.score-a.score||String(b.r.data).localeCompare(String(a.r.data))).slice(0,6)};
 const recordResult=x=>`<div class="answeritem"><b>${esc(x.r.data)} · ${esc(x.r.titulo)}</b><br><span class="source">${esc(x.r.registro_factual||'')}</span>${x.why.length?`<div class="matchwhy">Correspondência temática: ${esc(x.why.join(', '))}</div>`:''}${x.r.url_fonte?`<div style="margin-top:6px"><a href="${esc(x.r.url_fonte)}" target="_blank" rel="noopener">Fonte oficial</a></div>`:''}</div>`;

 const ask=()=>{const raw=q.value.trim(),n=strip(raw);if(!raw)return;let html='';if(/vot|pec|plp|\bpl\b|mpv|pdl|msf|rqs/.test(n)){const year=(n.match(/\b(2019|2020|2021|2022|2023|2024|2025|2026)\b/)||[])[1];const stopVote=new Set([...STOP,'votou','voto','votacao','votacoes','flavio','bolsonaro']);const terms=n.split(/[^a-z0-9]+/).filter(x=>x.length>1&&!stopVote.has(x)&&x!==year);let hits=V.filter(v=>(!year||String(v.data).startsWith(year))&&(!terms.length||terms.every(t=>strip([v.materia,v.objeto].join(' ')).includes(t))));if(!hits.length&&terms.length>1)hits=V.filter(v=>(!year||String(v.data).startsWith(year))&&terms.filter(t=>strip([v.materia,v.objeto].join(' ')).includes(t)).length>=Math.min(2,terms.length));hits=hits.slice(0,8);html=hits.length?`<b>${hits.length} resultado(s)${year?' em '+year:''}:</b>`+hits.map(voteResult).join(''):'Não encontrei votação suficientemente correspondente na base de 2019–2026.'}else if(/gasto|gastos|ceaps|cota parlamentar|correios|aluguel|passagens|locomocao|hospedagem|combustivel|divulgacao/.test(n)&&GO?.por_ano?.length){const year=(n.match(/\b(2019|2020|2021|2022|2023|2024|2025|2026)\b/)||[])[1];const row=year?GO.por_ano.find(x=>String(x.ano)===year):null;const cats=row?[...row.ceaps,...row.fora_ceaps]:[...GO.agregado_ceaps,...GO.agregado_fora_ceaps];const keys=['correios','aluguel','passagens','locomocao','hospedagem','combustivel','divulgacao','material','apoio','seguranca','impulsionamento','diarias'];const wanted=keys.filter(k=>n.includes(k));const hits=wanted.length?cats.filter(x=>wanted.some(k=>strip(x.categoria).includes(k))):[];if(hits.length){const total=hits.reduce((a,x)=>a+x.valor,0);html=`${year?`Em ${year}`:'No período 2019–2026'}, encontrei ${hits.length} categoria(s) correspondente(s), somando <b>${money(total)}</b>:`+hits.map(x=>`<div class="answeritem"><b>${esc(x.categoria)}</b> — ${money(x.valor)}</div>`).join('')+(row?`<div style="margin-top:6px"><a href="${esc(row.fonte_visual)}" target="_blank" rel="noopener">Fonte oficial do Senado</a></div>`:'')}else if(row){html=`Em <b>${year}</b>${row.parcial?' (parcial)':''}: CEAPS ${money(row.total_ceaps)}, gastos fora da CEAPS exibidos ${money(row.total_fora_ceaps)}, soma das duas seções ${money(row.total_mostrado)}. <a href="${esc(row.fonte_visual)}" target="_blank" rel="noopener">Fonte oficial do Senado</a>`}else{html=`No período 2019–2026: CEAPS <b>${money(GO.total_ceaps_periodo)}</b>, gastos fora da CEAPS exibidos <b>${money(GO.total_fora_ceaps_periodo)}</b>, soma das duas seções <b>${money(GO.total_mostrado_periodo)}</b>. Isso não representa o custo integral do mandato; veja a aba Dinheiro público.`}}else if(/emenda|recurso|dinheiro publico/.test(n)){html=`Há <b>${E.length}</b> emendas carregadas nesta amostra, com ${money(er.empenhado)} empenhados e ${money(er.pago)} pagos. A amostra ainda não representa o total do mandato.`}else if(/campanha|fornecedor|despesa eleitoral|receita/.test(n)){html=`No snapshot da campanha de 2026: <b>${money(receita)}</b> em receitas e <b>${money(campanha)}</b> em despesas declaradas.`}else if(/patrimonio|bens/.test(n)){const last=hist.at(-1);html=last?`Último patrimônio total carregado: <b>${money(last.patrimonio_total)}</b> (${last.ano}). Veja a aba Patrimônio para o histórico.`:'Não há patrimônio carregado.'}else{const hits=searchRecords(n);html=hits.length?`<b>${hits.length} resultado(s) com correspondência suficiente:</b>`+hits.map(recordResult).join(''):'Não encontrei correspondência temática suficientemente forte na base carregada. Prefiro não mostrar resultados fracos ou apenas coincidentes por palavras genéricas.'}answer.innerHTML=html};document.getElementById('ask').onclick=ask;q.onkeydown=e=>{if(e.key==='Enter')ask()};
}
