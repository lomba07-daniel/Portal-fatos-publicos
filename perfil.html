<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Perfil — Portal Fatos Públicos</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#17191c;--muted:#68707c;--line:#dde1e7;--accent:#202a44;--soft:#eef1f6;--ok:#236847;--warn:#8a5c00}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,Segoe UI,Arial,sans-serif;color:var(--ink)}header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2}.wrap{max-width:1100px;margin:auto;padding:16px 18px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.top a{color:var(--accent);text-decoration:none;font-weight:700}.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:16px;margin-top:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}.name{font-size:28px;font-weight:800;margin:0 0 5px}.muted{color:var(--muted);font-size:13px;line-height:1.5}.pill{display:inline-block;padding:5px 8px;border-radius:999px;background:var(--soft);font-size:11px;color:var(--muted);margin-right:5px}.deep{background:#e8eefb;color:#213a65}.mid{background:#eef7ef;color:#2e5c39}.basic{background:#fff3df;color:#76521b}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:16px}.field{border-top:1px solid var(--line);padding-top:10px}.field b{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}.sections{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:16px}.section h2{font-size:17px;margin:0 0 8px}.status{padding:10px;border-radius:10px;background:#fff8e7;border-left:3px solid var(--warn);font-size:12px;line-height:1.5}.ready{background:#eef8f2;border-left-color:var(--ok)}.btn{display:inline-block;background:var(--accent);color:#fff;text-decoration:none;border-radius:10px;padding:10px 13px;font-weight:700;margin-top:10px}.foot{font-size:12px;color:var(--muted);margin:18px 0 8px}@media(max-width:760px){.hero,.grid,.sections{grid-template-columns:1fr}.name{font-size:24px}.top{align-items:flex-start;flex-direction:column}}
.history{margin-top:16px}.history-list{display:grid;gap:9px;margin-top:13px}.history-row{display:grid;grid-template-columns:72px 1fr 150px;gap:12px;padding:12px;border:1px solid var(--line);border-radius:11px}.history-year{font-size:19px;font-weight:800}.history-result{text-align:right;font-size:12px}@media(max-width:760px){.history-row{grid-template-columns:58px 1fr}.history-result{grid-column:2;text-align:left}}
.asset-list{display:grid;gap:8px;margin-top:10px}.asset-row{padding:10px;border:1px solid var(--line);border-radius:10px}.asset-head{display:flex;justify-content:space-between;gap:12px;align-items:baseline}.asset-types{margin-top:6px}.asset-change{font-size:12px;font-weight:700;color:var(--ok)}.asset-change.down{color:#8b3030}@media(max-width:760px){.asset-head{align-items:flex-start;flex-direction:column;gap:2px}}
.finance-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.finance-number{padding:10px;border:1px solid var(--line);border-radius:10px}.finance-number b{display:block;font-size:16px;margin-top:3px}.finance-list{margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}@media(max-width:760px){.finance-grid{grid-template-columns:1fr}}
.mandate-meta{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.mandate-card{margin-top:16px}.mandate-card h2{margin-top:0}
</style>
</head>
<body><header><div class="wrap top"><div><b>Portal Fatos Públicos</b><div class="muted">Perfil eleitoral 2026</div></div><a href="candidatos.html">← Todos os candidatos</a></div></header><main class="wrap"><div id="app" class="card">Carregando perfil…</div></main>
<script>
const esc=s=>(s??'').toString().replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]));
const clean=v=>{const s=(v??'').toString().trim();return !s||s.startsWith('#')?'Não informado nesta carga':s};
async function b64gzip(url){const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw Error('Base eleitoral não encontrada');const b64=(await r.text()).replace(/\s+/g,''),bin=atob(b64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);if(!('DecompressionStream'in window))throw Error('Navegador sem suporte a gzip');return JSON.parse(await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).text())}
const camada=x=>x.camada||(x.cargo==='Presidente'||x.cargo==='Governador'?'profunda':x.cargo==='Senador'||x.cargo==='Deputado Federal'?'intermediaria':'basica');
const secoesProfundas=`<div class="card section"><h2>Patrimônio declarado</h2><div class="status">Base patrimonial do TSE ainda não conectada a este perfil.</div></div><div class="card section"><h2>Receitas e despesas de campanha</h2><div class="status">Prestação de contas eleitoral ainda não conectada a este perfil.</div></div><div class="card section"><h2>Trajetória pública</h2><div class="status">Histórico de eleições, cargos e partidos será carregado em etapa própria.</div></div><div class="card section"><h2>Atuação e decisões públicas</h2><div class="status">Votações, projetos, atos, gastos e emendas serão exibidos conforme a carreira pública do candidato.</div></div><div class="card section"><h2>Gestão executiva</h2><div class="status">Quando houver mandato executivo anterior, o portal mostrará indicadores antes, durante e ao fim da gestão, com contexto e fontes oficiais.</div></div><div class="card section"><h2>Discurso × ação</h2><div class="status">Relações entre declarações e registros públicos só serão classificadas quando houver evidências comparáveis suficientes.</div></div>`;
const secoesFederais=`<div class="card section"><h2>Patrimônio declarado</h2><div class="status">Base patrimonial do TSE ainda não conectada a este perfil.</div></div><div class="card section"><h2>Receitas e despesas de campanha</h2><div class="status">Prestação de contas eleitoral ainda não conectada a este perfil.</div></div><div class="card section"><h2>Histórico parlamentar</h2><div class="status">Quando houver mandato no Senado ou na Câmara, serão integradas votações nominais, proposições e funções exercidas.</div></div><div class="card section"><h2>Dinheiro público</h2><div class="status">Gastos de mandato e emendas serão conectados quando houver histórico parlamentar identificável.</div></div>`;
const secoesEstaduais=`<div class="card section"><h2>Patrimônio declarado</h2><div class="status">Base patrimonial do TSE ainda não conectada a este perfil.</div></div><div class="card section"><h2>Receitas e despesas de campanha</h2><div class="status">Prestação de contas eleitoral ainda não conectada a este perfil.</div></div><div class="card section"><h2>Trajetória pública</h2><div class="status">Histórico de eleições e cargos será carregado em etapa própria.</div></div><div class="card section"><h2>Atuação legislativa estadual</h2><div class="status">Dados das assembleias e da Câmara Legislativa serão integrados em fase posterior, conforme disponibilidade oficial.</div></div>`;
(async()=>{try{const params=new URLSearchParams(location.search),id=params.get('id'),cargoParam=params.get('cargo')||'',ufParam=params.get('uf')||'';if(!id)throw Error('Candidato não informado.');const mr=await fetch('dados/candidatos_manifesto_2026.json',{cache:'no-store'});if(!mr.ok)throw Error('Manifesto eleitoral não encontrado.');const M=await mr.json(),docs=await Promise.all(M.cargas_iniciais.map(x=>b64gzip(x.arquivo)));if(cargoParam&&ufParam&&M.cargas_por_cargo?.[cargoParam]?.[ufParam])docs.push(await b64gzip(M.cargas_por_cargo[cargoParam][ufParam].arquivo));let C=null,D=null;for(const doc of docs){const achado=(doc.candidatos||[]).find(x=>String(x.sq_candidato||x.id||x.sq||'')===String(id));if(achado){C=achado;D=doc;break}}if(!C)throw Error('Candidato não encontrado na carga informada. Volte ao catálogo e abra a ficha novamente.');const nome=C.nome_urna||C.nome||C.nome_completo||'Candidato',nivel=camada(C),deep=nivel==='profunda',mid=nivel==='intermediaria',isFlavio=/flavio.*bolsonaro/i.test((C.nome||'')+' '+(C.nome_urna||'')),badge=deep?'Profundidade máxima':mid?'Camada intermediária':'Camada básica',classe=deep?'deep':mid?'mid':'basic',layerText=deep?'Presidenciáveis e candidatos a governador terão a mesma profundidade factual, incluindo gestão executiva quando aplicável.':mid?'Candidatos ao Senado e à Câmara terão TSE, campanha e patrimônio, além de histórico parlamentar federal, gastos, emendas e votações quando houver mandato anterior.':'Deputados estaduais e distritais começam com a ficha eleitoral do TSE; o histórico das casas legislativas será acrescentado conforme a disponibilidade das fontes oficiais.',sections=deep?secoesProfundas:mid?secoesFederais:secoesEstaduais;document.title=`${nome} — Portal Fatos Públicos`;document.getElementById('app').outerHTML=`<section class="hero"><div class="card"><span class="pill ${classe}">${badge}</span><span class="pill">${esc(C.cargo)}</span><h1 class="name">${esc(nome)}</h1><div class="muted">${esc(C.partido_sigla||C.partido||'')} · nº ${esc(C.numero||'—')} ${C.uf&&C.uf!=='BR'?`· ${esc(C.uf)}`:''}</div><div class="grid"><div class="field"><b>Nome completo</b>${esc(clean(C.nome||C.nome_completo))}</div><div class="field"><b>Unidade eleitoral</b>${esc(clean(C.unidade_eleitoral||C.uf))}</div><div class="field"><b>Partido</b>${esc(clean(C.partido_nome||C.partido||C.partido_sigla))}</div><div class="field"><b>Situação registral na carga</b>${esc(clean(C.situacao||C.situacao_candidatura))}</div></div>${isFlavio?'<a class="btn" href="./">Abrir perfil profundo já disponível</a>':''}</div><div class="card"><h2 style="margin-top:0">Cobertura do perfil</h2><div class="status ${isFlavio?'ready':''}">${isFlavio?'<b>Perfil profundo já carregado.</b> Votações, gastos, emendas, patrimônio, campanha e trajetória estão sendo usados como piloto do projeto.':'<b>Ficha oficial já criada.</b> As próximas cargas preencherão automaticamente as seções aplicáveis a esta carreira pública.'}</div><p class="muted">${layerText} Ausência de informação não será tratada como fato negativo; apenas como dado ainda não carregado ou não aplicável.</p></div></section><section class="sections">${sections}</section><div class="foot">Fonte da identificação eleitoral: ${esc(D.fonte||M.fonte||'Tribunal Superior Eleitoral')} · arquivo gerado pelo TSE em ${esc(D.gerado_pelo_tse_em||M.gerado_pelo_tse_em||'data não informada')}.</div>`}catch(e){document.getElementById('app').innerHTML=`<b>Não foi possível abrir o perfil.</b><div class="muted" style="margin-top:6px">${esc(e.message)}</div>`}})();
(async()=>{try{const params=new URLSearchParams(location.search),id=params.get('id'),uf=params.get('uf')||'BR';if(!id)return;const mr=await fetch('dados/historico_candidaturas_manifesto_2026.json',{cache:'no-store'});if(!mr.ok)return;const meta=await mr.json(),ref=meta.arquivos_por_uf_atual?.[uf];if(!ref)return;const doc=await b64gzip(ref.arquivo),rows=doc.historicos?.[String(id)]||[];for(let i=0;i<100&&!document.querySelector('.hero');i++)await new Promise(r=>setTimeout(r,25));const hero=document.querySelector('.hero');if(!hero)return;const anteriores=rows.filter(x=>x.ano!=='2026'),body=rows.length?`<div class="status ready"><b>${anteriores.length} candidatura(s) anterior(es) localizada(s).</b> A eleição atual também aparece na linha do tempo para dar contexto.</div><div class="history-list">${rows.map(x=>`<div class="history-row"><div class="history-year">${esc(x.ano)}</div><div><b>${esc(x.cargo)}</b> · ${esc(x.partido_sigla||'Partido não informado')} · nº ${esc(x.numero||'—')}<div class="muted">${esc(x.eleicao)}${x.unidade_eleitoral?` · ${esc(x.unidade_eleitoral)}`:''}${x.uf?`/${esc(x.uf)}`:''}</div><div class="muted">Situação: ${esc(clean(x.situacao_candidatura))}</div></div><div class="history-result"><b>${esc(clean(x.resultado))}</b>${x.turno?`<div class="muted">${esc(x.turno)}º turno</div>`:''}</div></div>`).join('')}</div>`:`<div class="status">Nenhuma candidatura anterior foi localizada para esta pessoa no recurso histórico do TSE. Isso não significa ausência de atuação pública.</div>`;hero.insertAdjacentHTML('afterend',`<section class="card history"><h2 style="margin-top:0">Histórico eleitoral</h2>${body}<div class="foot">Fonte: ${esc(meta.fonte)} · base gerada em ${esc(meta.gerado_pelo_tse_em)}. Quantidade de votos será integrada em carga própria.</div></section>`)}catch(e){console.warn('Histórico eleitoral indisponível',e)}})();
(async()=>{try{const params=new URLSearchParams(location.search),id=params.get('id'),uf=params.get('uf')||'BR';if(!id)return;const [hmr,vmr]=await Promise.all([fetch('dados/historico_candidaturas_manifesto_2026.json',{cache:'no-store'}),fetch('dados/votos_historicos_manifesto_2026.json',{cache:'no-store'})]);if(!hmr.ok||!vmr.ok)return;const hm=await hmr.json(),vm=await vmr.json(),href=hm.arquivos_por_uf_atual?.[uf],vref=vm.arquivos_por_uf_atual?.[uf];if(!href||!vref)return;const [hd,vd]=await Promise.all([b64gzip(href.arquivo),b64gzip(vref.arquivo)]),hist=hd.historicos?.[String(id)]||[],votos=vd.votos?.[String(id)]||[],idx=new Map(votos.map(x=>[`${x.sq_candidato_eleicao}|${x.turno}`,x]));for(let i=0;i<120&&!document.querySelector('.history-list');i++)await new Promise(r=>setTimeout(r,25));const rows=document.querySelectorAll('.history-row');hist.forEach((h,i)=>{const v=idx.get(`${h.sq_candidato_eleicao}|${h.turno}`),alvo=rows[i]?.querySelector('.history-result');if(v&&alvo){alvo.insertAdjacentHTML('beforeend',`<div class="muted"><b>${Number(v.votos_nominais).toLocaleString('pt-BR')}</b> votos nominais</div>`)}});const foot=document.querySelector('.history .foot');if(foot&&votos.length)foot.textContent=`Fonte: ${hm.fonte} e votação nominal oficial do TSE. Totais de votos carregados para ${vm.anos_carregados.join(' e ')}.`}catch(e){console.warn('Votos históricos indisponíveis',e)}})();
(async()=>{try{const params=new URLSearchParams(location.search),id=params.get('id'),uf=params.get('uf')||'BR';if(!id)return;const mr=await fetch('dados/patrimonio_historico_manifesto_2026.json',{cache:'no-store'});if(!mr.ok)return;const meta=await mr.json(),ref=meta.arquivos_por_uf_atual?.[uf];if(!ref)return;const doc=await b64gzip(ref.arquivo),itens=doc.patrimonios?.[String(id)]||[];for(let i=0;i<120&&!document.querySelector('.sections');i++)await new Promise(r=>setTimeout(r,25));const titulo=[...document.querySelectorAll('.section h2')].find(x=>x.textContent.trim()==='Patrimônio declarado'),card=titulo?.parentElement;if(!card)return;const real=centavos=>Number(centavos||0)/100,moeda=centavos=>real(centavos).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});if(!itens.length){card.innerHTML=`<h2>Patrimônio declarado</h2><div class="status">Nenhum item patrimonial vinculado foi localizado nas cargas de ${meta.anos_carregados.join(', ')}. Isso pode indicar declaração sem bens ou ausência de registro vinculável; não permite concluir patrimônio zero.</div>`;return}const cron=[...itens].sort((a,b)=>Number(a.ano)-Number(b.ano)),anterior=new Map();cron.forEach((x,i)=>anterior.set(String(x.ano),cron[i-1]));const linhas=itens.map(x=>{const ant=anterior.get(String(x.ano)),delta=ant?x.total_centavos-ant.total_centavos:null,pct=ant&&ant.total_centavos?delta/ant.total_centavos*100:null,variacao=delta===null?'':`<div class="asset-change ${delta<0?'down':''}">${delta>=0?'+':'−'}${moeda(Math.abs(delta))}${pct===null?'':` (${pct>=0?'+':''}${pct.toLocaleString('pt-BR',{maximumFractionDigits:1})}%)`} desde ${esc(ant.ano)}</div>`,tipos=x.tipos.slice(0,5).map(t=>`${esc(t.tipo)}: <b>${moeda(t.valor_centavos)}</b>`).join(' · ');return `<div class="asset-row"><div class="asset-head"><div><b>${esc(x.ano)}</b> · ${Number(x.quantidade_bens).toLocaleString('pt-BR')} item(ns)</div><div><b>${moeda(x.total_centavos)}</b>${variacao}</div></div><div class="muted asset-types">${tipos}${x.tipos.length>5?` · +${x.tipos.length-5} categoria(s)`:''}</div></div>`}).join('');card.innerHTML=`<h2>Patrimônio declarado</h2><div class="status ready"><b>${itens.length} declaração(ões) localizada(s).</b> Valores nominais informados pelo candidato ao TSE.</div><div class="asset-list">${linhas}</div><div class="foot">Fonte: ${esc(meta.fonte)}. A variação nominal não representa, isoladamente, renda, ganho real ou irregularidade. Os valores não foram corrigidos pela inflação.</div>`}catch(e){console.warn('Patrimônio indisponível',e)}})();
(async()=>{try{const params=new URLSearchParams(location.search),id=params.get('id'),uf=params.get('uf')||'BR';if(!id)return;const mr=await fetch('dados/contas_eleitorais_manifesto_2026.json',{cache:'no-store'});if(!mr.ok)return;const meta=await mr.json(),ref=meta.arquivos_por_uf_atual?.[uf];if(!ref)return;const doc=await b64gzip(ref.arquivo),c=doc.contas?.[String(id)];for(let i=0;i<120&&!document.querySelector('.sections');i++)await new Promise(r=>setTimeout(r,25));const titulo=[...document.querySelectorAll('.section h2')].find(x=>x.textContent.trim()==='Receitas e despesas de campanha'),card=titulo?.parentElement;if(!card)return;const moeda=v=>(Number(v||0)/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});if(!c){card.innerHTML=`<h2>Receitas e despesas de campanha</h2><div class="status">Nenhuma movimentação vinculada foi localizada nesta fotografia das contas de 2026. Isso não significa irregularidade nem prestação de contas ausente.</div>`;return}const lista=(titulo,itens)=>itens.length?`<div class="finance-list"><b>${titulo}</b><div class="muted">${itens.slice(0,5).map(x=>`${esc(x.origem)}: <b>${moeda(x.valor_centavos)}</b>`).join(' · ')}${itens.length>5?` · +${itens.length-5} origem(ns)`:''}</div></div>`:'';card.innerHTML=`<h2>Receitas e despesas de campanha</h2><div class="status ready"><b>Movimentação de 2026 localizada.</b> Dados declarados e sujeitos a atualização.</div><div class="finance-grid"><div class="finance-number"><span class="muted">Recebido</span><b>${moeda(c.receitas_centavos)}</b><span class="muted">${Number(c.quantidade_receitas).toLocaleString('pt-BR')} registro(s)</span></div><div class="finance-number"><span class="muted">Contratado</span><b>${moeda(c.despesas_contratadas_centavos)}</b><span class="muted">${Number(c.quantidade_despesas_contratadas).toLocaleString('pt-BR')} registro(s)</span></div><div class="finance-number"><span class="muted">Pago</span><b>${moeda(c.despesas_pagas_centavos)}</b><span class="muted">${Number(c.quantidade_pagamentos).toLocaleString('pt-BR')} pagamento(s)</span></div></div>${lista('Origens das receitas',c.origens_receitas)}${lista('Origens das despesas contratadas',c.origens_despesas)}<div class="foot">Fonte: ${esc(meta.fonte)} · base gerada em ${esc(meta.gerado_pelo_tse_em)}. Contratado e pago são conceitos distintos; a diferença não é classificada automaticamente como dívida ou irregularidade.</div>`}catch(e){console.warn('Contas eleitorais indisponíveis',e)}})();
(async()=>{try{const id=new URLSearchParams(location.search).get('id');if(!id)return;const mr=await fetch('dados/mandatos_federais_atuais_manifesto_2026.json',{cache:'no-store'});if(!mr.ok)return;const meta=await mr.json(),doc=await b64gzip(meta.arquivo),m=doc.mandatos?.[String(id)];if(!m)return;for(let i=0;i<120&&!document.querySelector('.hero');i++)await new Promise(r=>setTimeout(r,25));const hero=document.querySelector('.hero');if(!hero)return;const partido=m.partido?`<span class="pill">${esc(m.partido)}</span>`:'',leg=m.legislatura?`<span class="pill">Legislatura ${esc(m.legislatura)}</span>`:'',participacao=m.participacao?`<span class="pill">${esc(m.participacao)}</span>`:'';hero.insertAdjacentHTML('afterend',`<section class="card mandate-card"><h2>Mandato federal atual</h2><div class="status ready"><b>${esc(m.cargo)} em exercício.</b> Vínculo confirmado por nome civil exato e unidade federativa na fonte oficial.</div><div class="mandate-meta"><span class="pill">${esc(m.casa)}</span><span class="pill">${esc(m.uf)}</span>${partido}${leg}${participacao}</div><div><b>${esc(m.nome_parlamentar||m.nome_civil)}</b><div class="muted">Nome civil na fonte: ${esc(m.nome_civil)}${m.situacao?` · ${esc(m.situacao)}`:''}</div></div><a class="btn" href="${esc(m.url_perfil)}" target="_blank" rel="noopener">Abrir perfil oficial</a><div class="foot">Fonte: ${esc(m.casa)} · atualização ${esc(meta.atualizado_em_utc)}. Partido e situação refletem a fonte parlamentar atual e podem diferir do registro eleitoral de 2026.</div></section>`)}catch(e){console.warn('Mandato federal atual indisponível',e)}})();
</script></body></html>
