<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Perfil — Portal Fatos Públicos</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#17191c;--muted:#68707c;--line:#dde1e7;--accent:#202a44;--soft:#eef1f6;--ok:#236847;--warn:#8a5c00}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,Segoe UI,Arial,sans-serif;color:var(--ink)}header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2}.wrap{max-width:1100px;margin:auto;padding:16px 18px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.top a{color:var(--accent);text-decoration:none;font-weight:700}.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:16px;margin-top:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}.name{font-size:28px;font-weight:800;margin:0 0 5px}.muted{color:var(--muted);font-size:13px;line-height:1.5}.pill{display:inline-block;padding:5px 8px;border-radius:999px;background:var(--soft);font-size:11px;color:var(--muted);margin-right:5px}.deep{background:#e8eefb;color:#213a65}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:16px}.field{border-top:1px solid var(--line);padding-top:10px}.field b{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}.sections{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:16px}.section h2{font-size:17px;margin:0 0 8px}.status{padding:10px;border-radius:10px;background:#fff8e7;border-left:3px solid var(--warn);font-size:12px;line-height:1.5}.ready{background:#eef8f2;border-left-color:var(--ok)}.btn{display:inline-block;background:var(--accent);color:#fff;text-decoration:none;border-radius:10px;padding:10px 13px;font-weight:700;margin-top:10px}.foot{font-size:12px;color:var(--muted);margin:18px 0 8px}@media(max-width:760px){.hero,.grid,.sections{grid-template-columns:1fr}.name{font-size:24px}.top{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body><header><div class="wrap top"><div><b>Portal Fatos Públicos</b><div class="muted">Perfil eleitoral 2026</div></div><a href="candidatos.html">← Todos os candidatos</a></div></header><main class="wrap"><div id="app" class="card">Carregando perfil…</div></main>
<script>
const esc=s=>(s??'').toString().replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]));
const clean=v=>{const s=(v??'').toString().trim();return !s||s.startsWith('#')?'Não informado nesta carga':s};
async function b64gzip(url){const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw Error('Base eleitoral não encontrada');const b64=(await r.text()).replace(/\s+/g,''),bin=atob(b64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);if(!('DecompressionStream'in window))throw Error('Navegador sem suporte a gzip');return JSON.parse(await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).text())}
(async()=>{try{const id=new URLSearchParams(location.search).get('id');if(!id)throw Error('Candidato não informado.');const D=await b64gzip('dados/candidatos_executivos_2026.b64');const C=(D.candidatos||[]).find(x=>String(x.sq_candidato||x.sq||'')===String(id));if(!C)throw Error('Candidato não encontrado na carga executiva.');const nome=C.nome_urna||C.nome||'Candidato';const isFlavio=/flavio.*bolsonaro/i.test((C.nome||'')+' '+(C.nome_urna||''));document.title=`${nome} — Portal Fatos Públicos`;document.getElementById('app').outerHTML=`<section class="hero"><div class="card"><span class="pill deep">Profundidade máxima</span><span class="pill">${esc(C.cargo)}</span><h1 class="name">${esc(nome)}</h1><div class="muted">${esc(C.partido_sigla||C.partido||'')} · nº ${esc(C.numero||'—')} ${C.uf?`· ${esc(C.uf)}`:''}</div><div class="grid"><div class="field"><b>Nome completo</b>${esc(clean(C.nome))}</div><div class="field"><b>Unidade eleitoral</b>${esc(clean(C.unidade_eleitoral||C.uf))}</div><div class="field"><b>Partido</b>${esc(clean(C.partido||C.partido_nome||C.partido_sigla))}</div><div class="field"><b>Situação registral na carga</b>${esc(clean(C.situacao||C.situacao_candidatura))}</div></div>${isFlavio?'<a class="btn" href="./">Abrir perfil profundo já disponível</a>':''}</div><div class="card"><h2 style="margin-top:0">Cobertura do perfil</h2><div class="status ${isFlavio?'ready':''}">${isFlavio?'<b>Perfil profundo já carregado.</b> Votações, gastos, emendas, patrimônio, campanha e trajetória estão sendo usados como piloto do projeto.':'<b>Perfil profundo em construção.</b> Este candidato já está identificado na base oficial do TSE. As próximas cargas acrescentarão patrimônio, campanha, trajetória, atuação pública e, quando aplicável, indicadores de gestão executiva.'}</div><p class="muted">Presidenciáveis e candidatos a governador terão a mesma camada de profundidade. Ausência de informação em uma seção não será tratada como fato negativo; apenas como dado ainda não carregado ou não aplicável.</p></div></section><section class="sections"><div class="card section"><h2>Patrimônio declarado</h2><div class="status">Base patrimonial do TSE ainda não conectada a este perfil.</div></div><div class="card section"><h2>Receitas e despesas de campanha</h2><div class="status">Prestação de contas eleitoral ainda não conectada a este perfil.</div></div><div class="card section"><h2>Trajetória pública</h2><div class="status">Histórico de eleições, cargos e partidos será carregado em etapa própria.</div></div><div class="card section"><h2>Atuação e decisões públicas</h2><div class="status">Votações, projetos, atos, gastos e emendas serão exibidos conforme a carreira pública do candidato.</div></div><div class="card section"><h2>Gestão executiva</h2><div class="status">Quando houver mandato executivo anterior, o portal mostrará indicadores antes, durante e ao fim da gestão, com contexto e fontes oficiais.</div></div><div class="card section"><h2>Discurso × ação</h2><div class="status">Relações entre declarações e registros públicos só serão classificadas quando houver evidências comparáveis suficientes.</div></div></section><div class="foot">Fonte da identificação eleitoral: ${esc(D.fonte||'Tribunal Superior Eleitoral')} · arquivo gerado pelo TSE em ${esc(D.gerado_pelo_tse_em||'data não informada')}.</div>`}catch(e){document.getElementById('app').innerHTML=`<b>Não foi possível abrir o perfil.</b><div class="muted" style="margin-top:6px">${esc(e.message)}</div>`}})();
</script></body></html>
