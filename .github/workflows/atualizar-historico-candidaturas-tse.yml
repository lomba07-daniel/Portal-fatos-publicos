name: Atualizar histórico de candidaturas TSE 2026

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/baixar_catalogo_candidatos_tse.py'
      - 'scripts/gerar_historico_candidaturas_tse.py'
      - '.github/workflows/atualizar-historico-candidaturas-tse.yml'
  schedule:
    - cron: '43 3,15 * * *'

permissions:
  contents: write

concurrency:
  group: atualizar-historico-candidaturas-tse
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Instalar cliente HTTP compatível com o CDN do TSE
        run: python -m pip install --disable-pip-version-check 'curl_cffi==0.13.0'

      - name: Baixar histórico oficial do TSE
        run: python scripts/baixar_catalogo_candidatos_tse.py /tmp/historico_candidatura_2026.zip --recurso historico

      - name: Gerar e validar cargas históricas
        run: python scripts/gerar_historico_candidaturas_tse.py /tmp/historico_candidatura_2026.zip --saida .

      - name: Publicar histórico quando houver mudança
        run: |
          if [ -n "$(git status --porcelain -- dados/historico_candidaturas_2026_*.b64 dados/historico_candidaturas_manifesto_2026.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add dados/historico_candidaturas_2026_*.b64 dados/historico_candidaturas_manifesto_2026.json
            git commit -m "Atualiza histórico eleitoral oficial do TSE"
            git pull --rebase origin main
            git push
          fi
