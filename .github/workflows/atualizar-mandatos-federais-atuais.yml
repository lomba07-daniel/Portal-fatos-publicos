name: Atualizar mandatos federais atuais

on:
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * 1'

permissions:
  contents: write

concurrency:
  group: atualizar-mandatos-federais-atuais
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Gerar base oficial e atualizar cobertura
        run: |
          python scripts/gerar_mandatos_federais_atuais_2026.py
          python scripts/gerar_escopo_prioritario_2026.py
      - name: Publicar alterações
        run: |
          if [ -z "$(git status --porcelain -- dados/mandatos_federais_atuais_2026.b64 dados/mandatos_federais_atuais_manifesto_2026.json dados/escopo_prioritario_2026.b64 dados/escopo_prioritario_manifesto_2026.json)" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/mandatos_federais_atuais_2026.b64 dados/mandatos_federais_atuais_manifesto_2026.json dados/escopo_prioritario_2026.b64 dados/escopo_prioritario_manifesto_2026.json
          git commit -m "Atualiza mandatos federais atuais"
          git pull --rebase origin main
          git push origin HEAD:main
