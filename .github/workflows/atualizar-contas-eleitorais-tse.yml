name: Atualizar contas eleitorais TSE 2026

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/baixar_contas_eleitorais_tse.py'
      - 'scripts/gerar_contas_eleitorais_tse.py'
      - '.github/workflows/atualizar-contas-eleitorais-tse.yml'
  schedule:
    - cron: '23 5,17 * * *'

permissions:
  contents: write

concurrency:
  group: atualizar-contas-eleitorais-tse
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v5
      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Instalar cliente HTTP compatível com o CDN do TSE
        run: python -m pip install --disable-pip-version-check 'curl_cffi==0.13.0'
      - name: Baixar prestação de contas oficial
        run: python scripts/baixar_contas_eleitorais_tse.py /tmp/prestacao_contas_2026.zip
      - name: Gerar e validar cargas financeiras
        run: python scripts/gerar_contas_eleitorais_tse.py /tmp/prestacao_contas_2026.zip --saida .
      - name: Publicar quando houver mudança
        run: |
          if [ -n "$(git status --porcelain -- dados/contas_eleitorais_2026_*.b64 dados/contas_eleitorais_manifesto_2026.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add dados/contas_eleitorais_2026_*.b64 dados/contas_eleitorais_manifesto_2026.json
            git commit -m "Atualiza contas eleitorais oficiais do TSE"
            git pull --rebase origin main
            git push
          fi
