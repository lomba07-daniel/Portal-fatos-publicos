name: Atualizar votações nominais dos candidatos na ALESC

on:
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizar-votacoes-alesc
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gerar carga oficial dos extratos nominais
        run: python scripts/gerar_votacoes_alesc_sc_2026.py
      - name: Publicar se houver mudança
        run: |
          if git diff --quiet -- dados/votacoes_alesc_2026_sc.b64 dados/votacoes_alesc_manifesto_2026.json; then
            echo "Sem alterações."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/votacoes_alesc_2026_sc.b64 dados/votacoes_alesc_manifesto_2026.json
          git commit -m "Atualiza votações nominais dos candidatos na ALESC"
          git push
