name: Atualizar patrimônio eleitoral TSE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/baixar_bens_candidatos_tse.py'
      - 'scripts/gerar_patrimonio_historico_tse.py'
      - '.github/workflows/atualizar-patrimonio-tse.yml'
  schedule:
    - cron: '53 4,16 * * *'

permissions:
  contents: write

concurrency:
  group: atualizar-patrimonio-tse
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v5
      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Instalar cliente HTTP compatível com o CDN do TSE
        run: python -m pip install --disable-pip-version-check 'curl_cffi==0.13.0'
      - name: Baixar bens oficiais
        run: |
          for ano in 2006 2008 2010 2012 2014 2016 2018 2020 2022 2024 2026; do
            python scripts/baixar_bens_candidatos_tse.py "$ano" "/tmp/bem_candidato_${ano}.zip"
          done
      - name: Gerar e validar cargas patrimoniais
        run: python scripts/gerar_patrimonio_historico_tse.py /tmp/bem_candidato_2006.zip /tmp/bem_candidato_2008.zip /tmp/bem_candidato_2010.zip /tmp/bem_candidato_2012.zip /tmp/bem_candidato_2014.zip /tmp/bem_candidato_2016.zip /tmp/bem_candidato_2018.zip /tmp/bem_candidato_2020.zip /tmp/bem_candidato_2022.zip /tmp/bem_candidato_2024.zip /tmp/bem_candidato_2026.zip --saida .
      - name: Validar série patrimonial completa
        run: python scripts/validar_patrimonio_historico.py
      - name: Publicar quando houver mudança
        run: |
          if [ -n "$(git status --porcelain -- dados/patrimonio_historico_2026_*.b64 dados/patrimonio_historico_manifesto_2026.json dados/validacao_patrimonio_historico_2026.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add dados/patrimonio_historico_2026_*.b64 dados/patrimonio_historico_manifesto_2026.json dados/validacao_patrimonio_historico_2026.json
            git commit -m "Atualiza patrimônio eleitoral oficial do TSE"
            git push
          fi
