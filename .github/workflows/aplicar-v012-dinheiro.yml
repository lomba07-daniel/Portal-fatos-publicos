name: Aplicar portal v0.12 dinheiro

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/aplicar_v012_dinheiro.py'
      - '.github/workflows/aplicar-v012-dinheiro.yml'

permissions:
  contents: write

concurrency:
  group: aplicar-v012-dinheiro
  cancel-in-progress: false

jobs:
  aplicar:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Aplicar segregação e gráficos de emendas
        run: python scripts/aplicar_v012_dinheiro.py

      - name: Validar JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          a=s.index('<script>')+8
          b=s.rindex('</script>')
          Path('/tmp/portal.js').write_text(s[a:b],encoding='utf-8')
          PY
          node --check /tmp/portal.js

      - name: Publicar v0.12
        run: |
          if [ -n "$(git status --porcelain -- index.html)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Separa gastos do mandato e emendas com gráficos"
            git push
          fi
