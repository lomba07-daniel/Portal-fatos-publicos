name: Atualizar atuação dos candidatos ao Senado

on:
  schedule:
    - cron: "41 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizar-atuacao-senado-prioritaria
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gerar carga oficial
        run: |
          python scripts/gerar_atuacao_senado_sc_2026.py
          python scripts/gerar_escopo_prioritario_2026.py
      - name: Publicar se houver mudança
        run: |
          if git diff --quiet -- dados/atuacao_senado_2026_sc.b64 dados/atuacao_senado_manifesto_2026.json dados/escopo_prioritario_2026.b64 dados/escopo_prioritario_manifesto_2026.json; then
            echo "Sem alterações."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/atuacao_senado_2026_sc.b64 dados/atuacao_senado_manifesto_2026.json dados/escopo_prioritario_2026.b64 dados/escopo_prioritario_manifesto_2026.json
          git commit -m "Atualiza atuação dos candidatos ao Senado"
          git push
