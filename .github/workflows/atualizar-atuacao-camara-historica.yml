name: Atualizar atuação histórica dos candidatos à Câmara

on:
  schedule:
    - cron: "43 11 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizar-atuacao-camara-historica
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gerar carga histórica oficial
        run: |
          python scripts/gerar_atuacao_camara_historica_sc_2026.py
          python scripts/gerar_escopo_prioritario_2026.py
      - name: Publicar se houver mudança
        run: |
          if git diff --quiet -- dados/atuacao_camara_historica_2026_sc.b64 dados/atuacao_camara_historica_manifesto_2026.json dados/escopo_prioritario_2026.b64 dados/escopo_prioritario_manifesto_2026.json; then
            echo "Sem alterações."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/atuacao_camara_historica_2026_sc.b64 dados/atuacao_camara_historica_manifesto_2026.json dados/escopo_prioritario_2026.b64 dados/escopo_prioritario_manifesto_2026.json
          git commit -m "Atualiza atuação histórica dos candidatos à Câmara"
          git push
